name: Sync and deploy CD catalog

on:
  push:
    branches: [main]
  # Daily at 09:00 UTC. Manual runs are available from Actions > Sync and deploy CD catalog.
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-catalog-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync catalog from Google Sheets
        if: github.event_name != 'push'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run sync:catalog

      - name: Commit changed catalog snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/albums.json
          if git diff --cached --quiet; then
            echo "Catalog snapshot is unchanged."
          else
            git commit -m "Sync CD catalog snapshot"
            git push
          fi

      - name: Restore artwork cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/cover-art
          key: cover-art-v1-${{ hashFiles('src/data/albums.json') }}
          restore-keys: |
            cover-art-v1-

      - name: Prepare artwork files
        id: cover-art
        run: npm run cache:cover-art

      - name: Save updated artwork cache
        if: steps.cover-art.outputs.cache-changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/cover-art
          key: cover-art-v1-${{ hashFiles('src/data/albums.json') }}-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
